workflows:
  android-apk:
    name: Build APK Ragnard Anime Tracker
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Générer les fichiers de plateforme manquants
        script: flutter create --platforms=android .
      - name: Récupérer les dépendances
        script: flutter pub get
      - name: Builder l'APK (release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
